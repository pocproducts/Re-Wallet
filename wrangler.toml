# Cloudflare — un solo Worker para la API y la web
#
# POR QUÉ UN SOLO WORKER Y NO PAGES
#
# La sesión es una cookie httpOnly con `SameSite=Lax`. Con dos orígenes
# (Pages en rewallet.win y el Worker en api.rewallet.win) esa cookie tiene que
# volverse cross-site: `SameSite=None; Secure` y un middleware de CORS con
# credenciales. Es posible, y son exactamente los dos cambios de seguridad que
# se evitaron a propósito cuando se eligió same-origin para el desarrollo.
#
# Un solo Worker mantiene la cookie como está, sin CORS, con un deploy y un
# conjunto de variables. La alternativa queda documentada en
# odd/tasks/deploy-workers.md, con el costo exacto.
#
# CLOUD PAGES IGUAL SIRVE: si eso es lo que se quiere, el plan B de abajo deja
# la web servida estática y la API con CORS. Es la misma app con dos
# despliegues, no dos apps.

name = "rewallet"
# El archivo vive en la raíz de ReWallet pero la app está en `bestpath/`, así que
# estas rutas son relativas a ESTE archivo. Sin el prefijo, wrangler no encuentra
# ni el entry ni los assets y falla antes de compilar.
main = "bestpath/apps/api/src/worker.ts"
compatibility_date = "2026-09-27"

# ── El dominio ───────────────────────────────────────────────────────────────
# Un solo Worker, un solo origen. La sesion es una cookie httpOnly con
# `SameSite=Lax`, y eso solo sobrevive si la web y la API viven en el MISMO
# host: en dos origenes la cookie tendria que volverse cross-site
# (`SameSite=None; Secure`) mas un middleware de CORS con credenciales. Son
# exactamente los dos cambios de seguridad que se evitaron a proposito.
# `custom_domain` hace que Cloudflare cree el registro DNS y el certificado.
routes = [{ pattern = "rewallet.win", custom_domain = true }]

# ── La web, servida por el mismo Worker ──────────────────────────────────────
# `dist/` tiene que existir antes de deployar: `pnpm --filter bestpath-wallet build`
[assets]
directory = "bestpath/apps/web/dist"
# La app es una SPA: cualquier ruta desconocida devuelve el index, no un 404,
# para que /home o /settings no revienten al recargar.
not_found_handling = "single-page-application"
# Por defecto Workers aplica ese fallback SÓLO a requests de navegación, las que
# detectan por la cabecera `Sec-Fetch-Mode: navigate`. Un browser la manda; un
# fetch(), un curl o un health check no, y ahí caía el 404 JSON de Hono en
# lugar del index. Declarar `/api/*` hace explícito qué corre en el Worker: la
# API y los webhooks, y todo lo demás como asset. Además desactiva la detección
# implícita, así el comportamiento deja de depender de una cabecera.
run_worker_first = ["/api/*"]

# ── Variables públicas ───────────────────────────────────────────────────────
[vars]
NODE_ENV = "production"
MONAD_CHAIN_ID = "143"
MONAD_RPC_URL = "https://rpc.monad.xyz"
MONAD_EXPLORER_URL = "https://monadscan.com"
GAS_PHASE = "mvp"
GAS_TESTNET_MODE = "false"

USDC_ADDRESS_MONAD = "0x754704Bc059F8C67012fEd69BC8A327a5aafb603"
AAVE_POOL_ADDRESS_MONAD = "0x69a5F9AD4f96ebf0a0C792dD42a01cC5C0102fef"
AAVE_ATOKEN_ADDRESS_MONAD = "0x35a73BAcb179d3740395A3ceCc87FF2e581d6042"

COOKIE_SECURE = "true"
# COOKIE_DOMAIN vacío y a propósito: host-only para un solo host. Poner un valor
# equivocado hace que la cookie no viaje, y el login queda roto SIN error visible.

# ── El front necesita la API en su propio origen ────────────────────────────
# Vacío = mismo origen, que es lo que este deploy hace: /api/* lo atiende el
# mismo Worker. Antes era `/api` por el proxy de Vite en desarrollo.
VITE_API_BASE_URL = ""

[observability]
enabled = true

# ── El espejo del saldo ──────────────────────────────────────────────────────
# `wallets.balance` es un espejo de la cadena, y un espejo hay que refrescarlo
# con algo que pueda llegar tarde: por eso es un cron y no un write dentro de
# `GET /auth/session`. Refrescarlo en la lectura de sesión metía una llamada de
# red y dos escrituras en el path que decide si la app carga, y un RPC lento se
# convertía en un 500 del login.
#
# Cada 5 minutos: la latencia de un depósito no es el contrato, y una moneda que
# tarda cinco minutos en aparecer es aceptable para un balance. Cloudflare no
# reintenta un cron, así que el handler captura y loguea el error en vez de dejar
# la excepción sin manejar y congelar el espejo en silencio.
[triggers]
crons = ["*/5 * * * *"]

# ── Postgres ─────────────────────────────────────────────────────────────────
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "ef0f012dca894ce19e6e2df66e0a385e"

# ── Secrets: `wrangler secret put <NOMBRE>` ─────────────────────────────────
# PRIVY_APP_ID
# PRIVY_APP_SECRET
# PRIVY_VERIFICATION_JWKS
# PRIVY_WALLET_AUTH_PRIVATE_KEY     # authorization key, base64 PKCS8
# PRIVY_WALLET_OWNER_ID             # key quorum
# SESSION_SECRET
# WEBHOOK_SECRET_PRIVY
# VITE_PRIVY_APP_ID                 # la que lee el front al construirse
