<!--
  Inline favicon, on purpose. Without a `rel="icon"` the browser requests
  /favicon.ico on every load and the console answers 404 — one recurring red
  line in the exact console you read to find real failures. A data URI keeps it
  to zero extra requests and zero binary files in the repo.
-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0A0B'/%3E%3Cpath d='M11 24V8h6.2a4.4 4.4 0 010 8.8H14' stroke='%233BAC28' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="device" id="device">
  <div class="app">
    <div class="screens" id="screens" role="main"></div>
    <div class="layer" id="layer"></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
