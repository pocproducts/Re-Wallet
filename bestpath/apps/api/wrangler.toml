# Cloudflare Workers — ReWallet API
#
# Three decisions in this file, each one earned:
#
# 1. `main` is `src/worker.ts`, NOT `src/index.ts`. The Node entry calls
#    `serve()` and reads a `.env` from disk; neither exists in workerd. Both
#    entries delegate to the same `createApp()`, so the app cannot behave
#    differently in production than it does locally.
#
# 2. `nodejs_compat` is NOT listed, and that is deliberate. It is enabled by
#    default for any `compatibility_date` on or after 2026-08-04, and ours is
#    2026-09-27. The deployment context document says to add the flag; with this
#    date it is implicit, and adding it is only a leftover.
#
# 3. Postgres is reached through **Hyperdrive**, and the driver does not
#    change. Cloudflare's own table of supported drivers lists Postgres.js from
#    `postgres@3.4.4`; we are on 3.4.9. Hyperdrive handles the TCP connection and
#    the pooling, which is the part Workers cannot do alone.
#
# Lo que NO puede vivir acá y por qué: nada del filesystem (D1 y el cursor del
# indexer), nada de child_process, y nada de timers largos. El indexer va por
# `triggers.crons` y pagina `eth_getLogs` en ventanas de 100 bloques, que es el
# límite que impone la RPC pública de Monad (verificado, no de documentación).

name = "rewallet-api"
main = "src/worker.ts"
compatibility_date = "2026-09-27"

# ── Variables: públicas, van en el repo ──────────────────────────────────────
[vars]
NODE_ENV = "production"
MONAD_CHAIN_ID = "143"
MONAD_RPC_URL = "https://rpc.monad.xyz"
MONAD_EXPLORER_URL = "https://monadscan.com"
GAS_PHASE = "mvp"
GAS_TESTNET_MODE = "false"

# Direcciones verificadas on-chain, no copiadas de un sitio.
USDC_ADDRESS_MONAD = "0x754704Bc059F8C67012fEd69BC8A327a5aafb603"
AAVE_POOL_ADDRESS_MONAD = "0x69a5F9AD4f96ebf0a0C792dD42a01cC5C0102fef"
AAVE_ATOKEN_ADDRESS_MONAD = "0x35a73BAcb179d3740395A3ceCc87FF2e581d6042"
COOKIE_SECURE = "true"
# COOKIE_DOMAIN vacío a propósito: host-only es lo correcto para un solo
# subdominio, y un valor equivocado hace que la cookie no viaje sin error visible.

# ── Hyperdrive: el pool de Postgres ──────────────────────────────────────────
# Reemplazar el id por el que devuelva `wrangler hyperdrive create`.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REEMPLAZAR_CON_EL_ID_DE_HYPERDRIVE"

[observability]
enabled = true

# ── Secrets: NUNCA en este archivo ───────────────────────────────────────────
# PRIVY_APP_ID, PRIVY_APP_SECRET, PRIVY_VERIFICATION_JWKS,
# PRIVY_WALLET_AUTH_PRIVATE_KEY, PRIVY_WALLET_OWNER_ID, SESSION_SECRET,
# WEBHOOK_SECRET_PRIVY
#   → wrangler secret put <NOMBRE>
